# Continuous integration: lint, host unit tests, libmicroros.a for every
# distribution and profile, and the CCS projects against each distribution's
# default library.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.2 shellcheck-py==0.11.0.1
      - name: Repository checks (whitespace, line endings, SPDX headers, links)
        run: python tools/check_repo.py
      - name: Shell scripts
        run: shellcheck -x library_generation/*.sh tools/*.sh tools/ci/ccs/*.sh
      - name: Python tools
        run: ruff check tools library_generation/scripts
      - name: Projectspecs and target configurations are well-formed XML
        run: |
          git ls-files '*.projectspec' '*.ccxml' |
              xargs python -c 'import sys, xml.dom.minidom; [xml.dom.minidom.parse(p) for p in sys.argv[1:]]'

  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, sanitize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Host unit tests (${{ matrix.variant }})
        run: bash tools/host_tests.sh --native ${{ matrix.variant == 'sanitize' && '--sanitize' || '' }}

  library:
    runs-on: ubuntu-24.04
    # Rolling follows upstream daily: a failure shows in the run without failing it.
    continue-on-error: ${{ matrix.distro == 'rolling' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical, rolling]
        profile: [small, default, large]
    env:
      OUT: microros_static_library/${{ matrix.distro }}/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The same library_generation/ produces the same library, apart from
      # upstream commits on the distro branches (the weekly build catches those).
      - name: Restore the library if library_generation/ is unchanged
        id: library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OUT }}
          key: library-${{ matrix.distro }}-${{ matrix.profile }}-${{ hashFiles('library_generation/**', '!library_generation/**/*.md') }}

      # TI Arm Clang, installed by the build into MICROROS_DOCKER_CACHE.
      - name: Restore TI Arm Clang
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/docker_cache/toolchain
            !${{ runner.temp }}/docker_cache/toolchain/*.bin
          key: tiarmclang-${{ hashFiles('library_generation/common.sh') }}

      - name: Build libmicroros.a
        if: steps.library.outputs.cache-hit != 'true'
        env:
          MICROROS_DOCKER_CACHE: ${{ runner.temp }}/docker_cache
        run: bash library_generation/build_library.sh --distro "${{ matrix.distro }}" --profile "${{ matrix.profile }}"

      - name: Summary
        run: |
          {
              echo "### libmicroros.a: ${{ matrix.distro }}, ${{ matrix.profile }}"
              echo
              echo "| | |"
              echo "| --- | --- |"
              echo "| Compiler | $(jq -r .compiler "$OUT/build_info.json") |"
              echo "| micro_ros_setup | $(jq -r .micro_ros_setup "$OUT/build_info.json") |"
              echo "| Built | $(jq -r .built_at "$OUT/build_info.json") |"
              echo "| Size | $(stat -c %s "$OUT/libmicroros.a") bytes |"
              echo "| From cache | ${{ steps.library.outputs.cache-hit == 'true' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: libmicroros-${{ matrix.distro }}-${{ matrix.profile }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

  # The CCS image is private (TI software), so pull requests from forks cannot
  # pull it and skip this job. Image tag: tools/ci/ccs/build_image.sh.
  firmware:
    needs: library
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.distro == 'rolling' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical, rolling]
    container:
      image: ghcr.io/konstc/micro_ros_f2838x_cm/ccs:ccs21.0.1-c2000ware26.02.00.00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: libmicroros-${{ matrix.distro }}-default
          path: microros_static_library/${{ matrix.distro }}/default

      - name: Build the CCS projects
        run: |
          bash tools/ccs_build.sh --library "${{ matrix.distro }}/default" \
              boards/tmdscncd28388d/cpu1_bootstrap/CCS/cpu1_bootstrap.projectspec \
              examples/*/CCS/*.projectspec tests/link_check/CCS/link_check.projectspec

      - name: RAM margin and summary
        run: |
          status=0
          {
              echo "### Firmware: ${{ matrix.distro }}, default library"
              echo
              echo "| Project | Configuration | Flash used, bytes | RAM free, bytes |"
              echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for map in .ccs_workspace/*/*/*.map; do
              project=$(basename "$map" .map)
              config=$(basename "$(dirname "$map")")
              [[ $project != cpu1_bootstrap ]] || continue
              flash=$(python3 tools/ram_report.py "$map" --regions CMBANK0_FLASH |
                      awk '$1 == "CMBANK0_FLASH" { print $3 }')
              report=$(python3 tools/ram_report.py "$map" --min-margin 8K) || status=1
              echo "$project $config: $(tail -1 <<< "$report")"
              echo "| $project | $config | $flash | $(awk '$1 == "total" { print $4 }' <<< "$report") |" \
                  >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: ccs-logs-${{ matrix.distro }}
          path: .ccs_workspace/logs
          retention-days: 14
