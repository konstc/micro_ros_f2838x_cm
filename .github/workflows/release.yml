# Release: on a tag vX.Y.Z-<distro> (e.g. v0.1.0-jazzy), builds libmicroros.a
# for every profile from scratch with build_library.sh in Docker (micro_ros_setup
# in micro-ROS's library builder image), as users build it, and creates a draft
# GitHub release with one zip per profile and SHA256SUMS. Publish the draft
# after checking it on the board.
name: Release

on:
  push:
    tags: ['v*-*']

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [small, default, large]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Distribution from the tag
        id: tag
        run: echo "distro=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"

      - name: Build libmicroros.a in micro-ROS's library builder image
        run: bash library_generation/build_library.sh --distro "${{ steps.tag.outputs.distro }}" --profile "${{ matrix.profile }}"

      # The zip contains microros_static_library/<distro>/<profile>/
      - name: Zip
        run: |
          zip -r -q "micro_ros_f2838x_cm-${GITHUB_REF_NAME}-${{ matrix.profile }}.zip" \
              "microros_static_library/${{ steps.tag.outputs.distro }}/${{ matrix.profile }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ matrix.profile }}
          path: micro_ros_f2838x_cm-*.zip
          if-no-files-found: error

  release:
    needs: library
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum ./*.zip > SHA256SUMS

      - name: Release notes
        run: |
          distro=${GITHUB_REF_NAME##*-}
          info=$(unzip -p "dist/micro_ros_f2838x_cm-${GITHUB_REF_NAME}-default.zip" \
                 "microros_static_library/${distro}/default/build_info.json")
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          cat > notes.md <<EOF
          ## libmicroros.a

          One zip per library profile (\`small\`, \`default\`, \`large\`, see
          [library_generation/profiles](${base}/library_generation/profiles/README.md)).
          Unzip it at the repository root: it creates
          \`microros_static_library/${distro}/<profile>/\`, where the CCS projects look
          for the library.

          - ROS 2 / micro-ROS: ${distro}
          - Compiler: $(jq -r .compiler <<<"$info")
          - Source revisions: \`sources.repos\` and \`build_info.json\` in each zip
          - Other tool versions: [README, Used versions](${base}/README.md#used-versions)

          Tested on the TMDSCNCD28388D: examples 01, 02 and 03 in Debug and Release,
          standalone boot from flash.
          EOF

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
